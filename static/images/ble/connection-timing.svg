<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">BLE 连接时序和参数关系</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7454d8"/></marker><style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#202024}.h{font-size:21px;font-weight:700}.s{font-size:15px;fill:#6d6d76}.m{font-size:17px;font-weight:700}.l{stroke:#cbc4e8;stroke-width:3}.d{stroke:#7454d8;stroke-width:4}</style></defs><rect width="1000" height="390" rx="24" fill="#faf8ff"/><text x="50" y="52" class="h">连接建立时序与参数约束</text><text x="55" y="110" class="m">Peripheral</text><text x="55" y="225" class="m">Central</text><path d="M220 105H930M220 220H930" class="l"/><path d="M300 105V220" class="d" marker-end="url(#a)"/><text x="245" y="88" class="s">广播包</text><text x="310" y="170" class="s">T_IFS = 150 μs</text><path d="M460 220V105" class="d" marker-end="url(#a)"/><text x="405" y="250" class="s">CONNECT_IND</text><path d="M570 105V220" class="d" marker-end="url(#a)"/><text x="585" y="170" class="s">连接事件 #1</text><path d="M745 105V220" class="d" marker-end="url(#a)"/><text x="758" y="170" class="s">连接事件 #2</text><path d="M570 285H745" class="d" marker-end="url(#a)"/><text x="600" y="315" class="s">Connection Interval</text><rect x="55" y="340" width="880" height="1" fill="#ded9f3"/><text x="55" y="372" class="s">约束：Supervision Timeout  &gt;  2 × (1 + Slave Latency) × Connection Interval Max</text></svg>
