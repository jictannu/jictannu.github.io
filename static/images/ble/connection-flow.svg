<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">BLE 连接流程</title><desc id="desc">外设广播，中心扫描，中心发起连接，随后建立数据连接。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7454d8"/></marker><style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#202024}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#6d6d76}.b{fill:#fffdf8;stroke:#ded9f3;stroke-width:2}.p{fill:#f0ebff}.c{fill:#e9f8f3}</style></defs><rect width="1000" height="360" rx="24" fill="#faf8ff"/><text x="55" y="55" class="h">BLE：从被发现到建立连接</text><rect x="55" y="110" width="190" height="150" rx="16" class="b p"/><text x="80" y="155" class="h">Peripheral</text><text x="80" y="185" class="s">配置参数与数据</text><text x="80" y="212" class="s">启动广播</text><path d="M255 185H380" stroke="#7454d8" stroke-width="4" marker-end="url(#a)"/><text x="270" y="165" class="s">ADV_IND</text><rect x="390" y="110" width="190" height="150" rx="16" class="b"/><text x="430" y="155" class="h">Central</text><text x="425" y="185" class="s">扫描 · 过滤</text><text x="413" y="212" class="s">Advertising Report</text><path d="M590 185H715" stroke="#7454d8" stroke-width="4" marker-end="url(#a)"/><text x="605" y="165" class="s">CONNECT_IND</text><rect x="725" y="110" width="220" height="150" rx="16" class="b c"/><text x="770" y="155" class="h">Connected</text><text x="755" y="185" class="s">Connection Handle</text><text x="758" y="212" class="s">GATT 数据交换</text><text x="55" y="315" class="s">广播信道 37 / 38 / 39  →  建立连接后切换到数据信道</text></svg>
