<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">BLE 广播状态机</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7454d8"/></marker><style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#202024}.h{font-size:21px;font-weight:700}.s{font-size:15px;fill:#6d6d76}.b{fill:#fffdf8;stroke:#ded9f3;stroke-width:2}</style></defs><rect width="1000" height="330" rx="24" fill="#faf8ff"/><text x="50" y="55" class="h">广播启动与更新规则</text><rect x="55" y="120" width="190" height="100" rx="16" class="b"/><text x="88" y="162" class="h">Idle</text><text x="88" y="190" class="s">未广播</text><path d="M250 170H385" stroke="#7454d8" stroke-width="4" marker-end="url(#a)"/><text x="262" y="145" class="s">Set Parameters</text><rect x="395" y="120" width="215" height="100" rx="16" class="b"/><text x="430" y="162" class="h">Configured</text><text x="430" y="190" class="s">设置数据 / Scan Response</text><path d="M615 170H750" stroke="#7454d8" stroke-width="4" marker-end="url(#a)"/><text x="653" y="145" class="s">Enable</text><rect x="760" y="120" width="180" height="100" rx="16" fill="#e9f8f3" stroke="#b9e7d6" stroke-width="2"/><text x="800" y="162" class="h">Advertising</text><text x="800" y="190" class="s">广播中</text><path d="M850 230V280H160V230" fill="none" stroke="#7454d8" stroke-width="3" marker-end="url(#a)"/><text x="355" y="305" class="s">修改广播参数：必须 Disable 后重新配置</text><text x="760" y="85" class="s">数据可在下一个广播事件热更新</text></svg>
